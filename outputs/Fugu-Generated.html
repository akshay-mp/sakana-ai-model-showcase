<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070d0c" />
<title>The Ancestor's Journal</title>
<style>
:root{
  --ink:#050a09;
  --paper:#e9dcbd;
  --paper-dark:#cdbb95;
  --gold:#e2b169;
  --gold-dim:#a8834a;
  --emerald:#2c5a4c;
  --moss:#8fae7a;
  --blood:#9a3b2e;
  --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#050a09; color:#eef2ec; font-family:var(--ui); }
body{ overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
#stage{ position:fixed; inset:0; overflow:hidden; background:#050a09; }
#game{ display:block; position:absolute; left:0; top:0; width:100%; height:100%; image-rendering:auto; }
body.letterboxed .prompt{ bottom:calc(var(--play-b) + 14px + var(--safe-b)); }
body.letterboxed .subtitle{ bottom:calc(var(--play-b) + 10px + var(--safe-b)); }
body.letterboxed .banner{ top:calc(9px + var(--safe-t)); }
body.letterboxed .tc{ width:74px; height:74px; }
body.letterboxed .tc.big{ width:92px; height:92px; }
body.letterboxed .tc.small{ width:60px; height:60px; }
body.letterboxed .hud{ padding-top:calc(8px + var(--safe-t)); }
body.letterboxed .hud-objective{ font-size:12.5px; max-width:52vw; }
body.letterboxed .hud-chapter{ font-size:9px; letter-spacing:.18em; }
body.letterboxed .gold-chip{ padding:5px 9px; font-size:10px; }
body.letterboxed .btn-icon{ width:36px; height:36px; border-radius:10px; }
body.letterboxed .rotate-hint{ display:flex; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(158px + var(--safe-b)); }
button{ font-family:inherit; color:inherit; }
.hidden{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- HUD ---------- */
.hud{
  position:absolute; inset:0; pointer-events:none; padding:calc(10px + var(--safe-t)) 12px 10px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  text-shadow:0 2px 10px rgba(0,0,0,.85);
}
.hud-left{ max-width:min(62%, 520px); }
.hud-chapter{ font-size:10px; letter-spacing:.28em; color:#d8c79f; opacity:.9; text-transform:uppercase; }
.hud-objective{ margin-top:5px; font-family:var(--serif); font-size:clamp(13px,2.6vw,18px); line-height:1.3; color:#f2efe6; }
.hud-objective b{ color:var(--gold); font-weight:600; }
.hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
.gold-chip{
  display:flex; align-items:center; gap:7px; padding:7px 11px; border-radius:999px;
  background:rgba(12,24,20,.62); border:1px solid rgba(226,177,105,.45);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  font-size:11px; letter-spacing:.14em; color:#e8cf9d;
}
.gold-chip b{ font-size:13px; letter-spacing:.04em; color:#ffdfa0; }
.gold-chip .dot{ width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe9b8, #c8912f 70%, #6b4713); box-shadow:0 0 10px rgba(255,205,120,.7); }
.btn-icon{
  width:40px; height:40px; border-radius:12px; border:1px solid rgba(233,220,189,.22);
  background:rgba(10,20,18,.55); color:#e9dcbd; display:grid; place-items:center;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); cursor:pointer;
  transition:background .15s, border-color .15s, transform .1s;
}
.btn-icon:hover{ background:rgba(28,48,42,.8); border-color:rgba(226,177,105,.6); }
.btn-icon:active{ transform:scale(.94); }
.btn-icon svg{ width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.btn-icon.muted{ color:#7d8a84; }

.banner{
  position:absolute; top:calc(62px + var(--safe-t)); left:50%; transform:translateX(-50%);
  padding:8px 18px; border-radius:999px; font-size:11px; letter-spacing:.26em; text-transform:uppercase;
  background:rgba(60,14,10,.62); border:1px solid rgba(214,90,64,.62); color:#ffd9c8;
  box-shadow:0 8px 30px rgba(0,0,0,.5); white-space:nowrap; pointer-events:none;
  animation:bannerPulse 1.6s ease-in-out infinite;
}
.banner.calm{ background:rgba(12,32,28,.6); border-color:rgba(120,190,160,.5); color:#cfeee1; animation:none; }
@keyframes bannerPulse{ 0%,100%{ opacity:.72 } 50%{ opacity:1 } }

.prompt{
  position:absolute; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; padding:9px 16px 9px 12px; border-radius:14px;
  background:rgba(8,16,14,.78); border:1px solid rgba(226,177,105,.45); color:#f3ead4;
  font-size:13px; letter-spacing:.02em; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 10px 34px rgba(0,0,0,.55); pointer-events:none; animation:promptIn .22s ease-out;
  max-width:min(92vw, 520px); text-align:left;
}
@keyframes promptIn{ from{ opacity:0; transform:translate(-50%, 8px) } to{ opacity:1; transform:translate(-50%,0) } }
.key{
  min-width:24px; height:24px; padding:0 6px; border-radius:6px; display:grid; place-items:center;
  background:linear-gradient(#2a3a34,#16211e); border:1px solid rgba(233,220,189,.3);
  font-size:11px; font-weight:700; letter-spacing:.06em; color:#f6e7c4; flex:none;
}

.subtitle{
  position:absolute; left:50%; bottom:calc(26px + var(--safe-b)); transform:translateX(-50%);
  width:min(92vw, 780px); pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.sub-line{
  padding:10px 18px; border-radius:12px; background:linear-gradient(180deg, rgba(6,12,11,.86), rgba(6,12,11,.72));
  border-left:2px solid rgba(226,177,105,.6); font-family:var(--serif); font-size:clamp(14px,2.9vw,19px);
  line-height:1.45; color:#f4efe2; box-shadow:0 12px 40px rgba(0,0,0,.5);
  animation:subIn .28s ease-out;
}
.sub-line .who{ display:block; font-family:var(--ui); font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-bottom:3px; }
.sub-line.thought{ font-style:italic; border-left-color:rgba(150,200,180,.55); color:#dfeae2; }
.sub-cont{ font-size:10px; letter-spacing:.24em; color:rgba(233,220,189,.55); text-transform:uppercase; }
@keyframes subIn{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }

/* ---------- Touch controls ---------- */
.touch{ position:absolute; inset:auto 0 0 0; height:190px; pointer-events:none; }
.touch-left{ position:absolute; left:14px; bottom:calc(14px + var(--safe-b)); display:flex; gap:12px; pointer-events:auto; }
.touch-right{ position:absolute; right:14px; bottom:calc(14px + var(--safe-b)); display:flex; align-items:flex-end; gap:10px; pointer-events:auto; }
.tc{
  width:66px; height:66px; border-radius:50%; display:grid; place-items:center;
  background:rgba(10,20,18,.55); border:1px solid rgba(233,220,189,.3); color:#f1e6cc;
  font-size:10px; letter-spacing:.14em; font-weight:700; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  box-shadow:0 6px 20px rgba(0,0,0,.4); touch-action:none;
}
.tc svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.tc.big{ width:84px; height:84px; }
.tc.small{ width:54px; height:54px; font-size:9px; }
.tc.active{ background:rgba(60,96,80,.8); border-color:rgba(226,177,105,.75); transform:scale(.96); }
.tc.tc-hide{ background:rgba(16,26,40,.6); }

/* ---------- Overlays ---------- */
.overlay{
  position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  padding:calc(16px + var(--safe-t)) 14px calc(16px + var(--safe-b)); overflow:auto;
  background:radial-gradient(120% 100% at 50% 0%, rgba(8,16,14,.72), rgba(3,6,6,.94));
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  animation:fadeIn .3s ease-out;
}
@keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }
.panel{
  width:min(720px, 96vw); border-radius:18px; padding:22px 22px 18px;
  background:linear-gradient(170deg, rgba(20,32,28,.96), rgba(9,16,15,.97));
  border:1px solid rgba(226,177,105,.28); box-shadow:0 30px 90px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
}
.panel h2{ margin:0 0 6px; font-family:var(--serif); font-weight:500; font-size:clamp(22px,4vw,30px); color:#f4ecda; letter-spacing:.01em; }
.panel p{ color:#b9c6bd; line-height:1.6; font-size:14px; }
.eyebrow{ font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:12px 20px; border-radius:12px; cursor:pointer; font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  background:rgba(255,255,255,.04); border:1px solid rgba(233,220,189,.26); color:#f0e7d3;
  transition:background .16s, border-color .16s, transform .1s; min-height:46px;
}
.btn:hover{ background:rgba(226,177,105,.14); border-color:rgba(226,177,105,.7); }
.btn:active{ transform:scale(.98); }
.btn.primary{ background:linear-gradient(180deg, #d9a95f, #b6833c); color:#20170a; border-color:#e8c78d; font-weight:700; box-shadow:0 8px 26px rgba(190,140,60,.24); }
.btn.primary:hover{ background:linear-gradient(180deg, #e8bb72, #c08d43); }
.btn.ghost{ background:transparent; }
.btn:focus-visible{ outline:2px solid #ffe0a3; outline-offset:3px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }

/* Start menu */
.title-wrap{ text-align:center; width:min(880px, 94vw); }
.title-kicker{ font-size:10px; letter-spacing:.5em; text-transform:uppercase; color:#c8b184; opacity:.9; }
.title-main{
  font-family:var(--serif); font-weight:500; margin:14px 0 6px; line-height:.95;
  font-size:clamp(38px, 9vw, 86px); letter-spacing:.02em;
  background:linear-gradient(180deg, #fff6e2 10%, #e8c88f 55%, #a97f3f 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 20px 60px rgba(0,0,0,.7); filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));
}
.title-sub{ font-family:var(--serif); font-style:italic; color:#c3d0c6; font-size:clamp(14px,2.6vw,19px); max-width:560px; margin:0 auto 26px; line-height:1.5; }
.menu-actions{ display:flex; flex-direction:column; gap:10px; align-items:center; }
.menu-actions .btn{ width:min(320px, 88vw); }
.menu-foot{ margin-top:18px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#7d8d84; }
.menu-sound{ display:flex; align-items:center; gap:10px; justify-content:center; margin-top:16px; color:#9fb0a6; font-size:11px; letter-spacing:.14em; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:140px; height:22px; background:transparent; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track{ height:3px; border-radius:2px; background:rgba(233,220,189,.28); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; margin-top:-6px; border-radius:50%; background:#e2b169; box-shadow:0 0 0 3px rgba(226,177,105,.2); }
input[type=range]::-moz-range-track{ height:3px; border-radius:2px; background:rgba(233,220,189,.28); }
input[type=range]::-moz-range-thumb{ width:15px; height:15px; border:none; border-radius:50%; background:#e2b169; }

/* Chapter card */
.chapter-card{ text-align:center; animation:chapterIn .8s ease-out; }
.chapter-card .num{ font-family:var(--serif); font-size:clamp(52px,12vw,110px); color:rgba(226,177,105,.14); line-height:1; margin-bottom:-18px; }
.chapter-card h1{ font-family:var(--serif); font-weight:500; font-size:clamp(24px,5.4vw,44px); margin:0 0 12px; color:#f6edda; }
.chapter-card p{ font-style:italic; font-family:var(--serif); color:#b9c9bf; font-size:clamp(14px,2.7vw,18px); max-width:520px; margin:0 auto; }
@keyframes chapterIn{ from{ opacity:0; transform:translateY(16px) } to{ opacity:1; transform:none } }

/* Journal */
.journal{
  width:min(1080px, 97vw); max-height:min(94vh, 860px); display:flex; flex-direction:column; gap:0;
  border-radius:16px; overflow:hidden; border:1px solid rgba(226,177,105,.34);
  box-shadow:0 40px 120px rgba(0,0,0,.8);
  background:
    radial-gradient(120% 90% at 20% 0%, rgba(255,248,225,.9), rgba(226,210,172,.92) 40%, rgba(198,178,136,.95) 100%);
  color:#2b2418;
}
.journal-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px;
  background:linear-gradient(180deg, #241b10, #17110a); color:#e6d6b4; flex:none;
}
.journal-title{ font-family:var(--serif); letter-spacing:.2em; font-size:11px; text-transform:uppercase; color:#d9c39a; }
.journal-tabs{ display:flex; gap:6px; }
.jtab{
  padding:7px 12px; border-radius:8px; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  background:rgba(255,255,255,.05); border:1px solid rgba(226,177,105,.24); color:#cdbb98; cursor:pointer;
}
.jtab.active{ background:rgba(226,177,105,.2); border-color:rgba(226,177,105,.7); color:#ffe8bc; }
.journal-close{ width:34px; height:34px; border-radius:8px; border:1px solid rgba(226,177,105,.3); background:rgba(0,0,0,.2); color:#e9dcbd; cursor:pointer; font-size:16px; }
.journal-body{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
.page-spread{ display:grid; grid-template-columns:1fr 1fr; min-height:420px; }
.page{ padding:24px 26px; position:relative; background:linear-gradient(180deg, rgba(255,250,232,.5), rgba(255,250,232,0) 30%); }
.page.left{ border-right:1px solid rgba(90,70,40,.2); }
.page h3{ font-family:var(--serif); font-weight:500; font-size:22px; margin:0 0 4px; color:#33291a; }
.page .pg-num{ position:absolute; bottom:12px; right:18px; font-family:var(--serif); font-size:11px; color:#8a7853; letter-spacing:.14em; }
.page p{ font-family:var(--serif); font-size:15.5px; line-height:1.62; color:#3a2f1f; margin:0 0 12px; }
.page p.quote{ font-style:italic; border-left:2px solid rgba(120,90,40,.45); padding-left:12px; }
.page .scrawl{ font-style:italic; color:#584529; }
.page ul{ margin:0; padding-left:18px; font-family:var(--serif); color:#3a2f1f; line-height:1.6; }
.journal-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; background:rgba(30,24,14,.92); color:#e6d6b4; flex:none; }
.journal-nav .btn{ min-height:40px; padding:9px 16px; font-size:11px; }
.journal-ill{ width:100%; height:auto; border-radius:8px; display:block; background:#e4d6b4; box-shadow:inset 0 0 40px rgba(120,90,40,.18); border:1px solid rgba(100,80,45,.24); cursor:zoom-in; }
.ill-cap{ font-family:var(--serif); font-style:italic; font-size:12px; color:#6d5c3d; margin-top:6px; text-align:center; }
.clue{ padding:10px 12px; border-radius:8px; background:rgba(120,90,40,.08); border:1px solid rgba(120,90,40,.18); margin-bottom:10px; }
.clue b{ font-family:var(--serif); display:block; font-size:15px; color:#33291a; margin-bottom:2px; }
.clue span{ font-family:var(--serif); font-size:14px; color:#4a3c26; line-height:1.5; }
.empty{ font-family:var(--serif); font-style:italic; color:#7a6847; }

/* Pause + complete */
.pause-actions{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
.pause-actions .btn{ justify-content:flex-start; width:100%; }
.setting{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid rgba(233,220,189,.1); font-size:13px; color:#c6d2c9; }
.complete{ text-align:center; width:min(760px, 94vw); }
.complete .crest{ width:74px; height:74px; margin:0 auto 14px; }
.complete h1{ font-family:var(--serif); font-weight:500; letter-spacing:.14em; font-size:clamp(24px,5.6vw,44px); margin:0 0 6px;
  background:linear-gradient(180deg,#fff3d8,#e0b573 60%,#9c7433); -webkit-background-clip:text; background-clip:text; color:transparent; }
.complete .goldline{ font-family:var(--serif); font-size:clamp(16px,3.4vw,22px); color:#ffdfa0; margin:14px 0 6px; }
.complete .sub{ color:#a9bcb1; font-size:11px; letter-spacing:.24em; text-transform:uppercase; }
.complete .closing{ font-family:var(--serif); font-style:italic; color:#d7e2d9; font-size:clamp(15px,3vw,20px); line-height:1.6; max-width:520px; margin:22px auto 26px; }
.complete .hintline{ margin-top:18px; font-size:11px; color:#84978c; letter-spacing:.14em; }

.toast{
  position:absolute; left:50%; top:calc(96px + var(--safe-t)); transform:translateX(-50%);
  padding:10px 16px; border-radius:12px; background:rgba(12,26,22,.9); border:1px solid rgba(150,200,170,.35);
  font-size:13px; color:#e7f0e6; box-shadow:0 14px 44px rgba(0,0,0,.6); animation:toastIn .3s ease-out;
  max-width:min(90vw,520px); text-align:center; z-index:45;
}
@keyframes toastIn{ from{ opacity:0; transform:translate(-50%,-8px) } to{ opacity:1; transform:translate(-50%,0) } }

.rotate-hint{ display:none; }
@media (orientation:portrait) and (max-width:820px){
  .rotate-hint{
    display:flex; position:absolute; left:50%; bottom:calc(200px + var(--safe-b)); transform:translateX(-50%);
    font-size:10px; letter-spacing:.2em; color:rgba(233,220,189,.55); text-transform:uppercase; pointer-events:none;
    align-items:center; gap:8px;
  }
}
@media (max-width:560px){
  .page-spread{ grid-template-columns:1fr; }
  .page.left{ border-right:none; border-bottom:1px solid rgba(90,70,40,.2); }
  .hud-objective{ font-size:13px; }
  .journal-tabs .jtab{ padding:6px 8px; font-size:9px; }
  .panel{ padding:18px 16px 14px; }
  .prompt{ bottom:calc(182px + var(--safe-b)); font-size:12px; }
  .subtitle{ bottom:calc(176px + var(--safe-b)); }
  .banner{ top:calc(54px + var(--safe-t)); font-size:10px; letter-spacing:.18em; padding:7px 13px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Game view"></canvas>

  <div id="hud" class="hud hidden">
    <div class="hud-left">
      <div id="chapterLabel" class="hud-chapter">PROLOGUE</div>
      <div id="objective" class="hud-objective"></div>
    </div>
    <div class="hud-right">
      <div id="goldChip" class="gold-chip hidden" title="Gold carried. It only counts once you leave the mountain."><span class="dot"></span>CARRIED <b id="goldValue">0.00 kg</b></div>
      <button id="btnJournal" class="btn-icon" aria-label="Open journal" title="Journal (J)">
        <svg viewBox="0 0 24 24"><path d="M4 4.5h7a2 2 0 0 1 2 2v13a2.4 2.4 0 0 0-2-1.2H4z"/><path d="M20 4.5h-5a2 2 0 0 0-2 2v13a2.4 2.4 0 0 1 2-1.2h5z"/></svg>
      </button>
      <button id="btnSound" class="btn-icon" aria-label="Mute or unmute" title="Sound (M)">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <button id="btnPause" class="btn-icon" aria-label="Pause" title="Pause (Esc)">
        <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      </button>
    </div>
  </div>

  <div id="banner" class="banner hidden"></div>
  <div id="prompt" class="prompt hidden"></div>
  <div id="subtitle" class="subtitle hidden"></div>

  <div id="touch" class="touch hidden">
    <div class="touch-left">
      <button class="tc" data-act="left" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="tc" data-act="right" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="touch-right">
      <button class="tc small tc-hide" data-act="hide" aria-label="Hide">HIDE</button>
      <button class="tc" data-act="interact" aria-label="Interact">USE</button>
      <button class="tc big" data-act="jump" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </div>

  <div class="rotate-hint" id="rotateHint"><span>◱</span> Rotate for a wider view</div>
  <div id="overlay" class="overlay hidden"></div>

const DESIGN_H = 720;
/* The playfield is a 720-unit-tall stage. Wide screens fill the viewport; narrow portrait
   screens letterbox the canvas to a readable aspect and keep the touch pad in the free space. */
function computeLayout(w, h) {
  w = Math.max(240, w || 0); h = Math.max(240, h || 0);
  const aspect = w / h;
  const minAspect = 1.30;
  let canvasW = w, canvasH = h;
  if (aspect < minAspect) canvasH = Math.round(w / minAspect);
  canvasW = Math.round(canvasW); canvasH = Math.round(canvasH);
  const scale = canvasH / DESIGN_H;
  return {
    canvasW, canvasH, canvasLeft: 0, canvasTop: 0,
    scale, viewW: Math.round(canvasW / scale), viewH: DESIGN_H,
    playBottom: Math.max(0, Math.round(h - canvasH)),
    portrait: aspect < minAspect
  };
}

  inputAction(action) {

      else if (this.overlayType === 'journal') UI.journalKey(action);
      else if (this.overlayType === 'menu' && action === 'interact') UI.startIntro();
      else if (this.overlayType === 'pause' && action === 'pause') UI.resume();
      return;
    }
    if (this.scene === 'bus') { if (action === 'interact' || action === 'jump') this.startYard(); return; }
    if (this.scene === 'yard') { if (action === 'interact' || action === 'jump') this.startTrain(); return; }

  interact() {

          UI.setObjective('Follow the stream into the forest.');

        ];

            satchel:'The strap is cut clean through. Rain has softened the prints.',
            lantern:'The glass is cracked, but the brass is warm. Someone was here moments ago.',
            tracks:'Several sets of boot marks converge above the stream crossing.'

      }

    }
    if (this.scene === 'steps') {
      if (p.x > 390) this.enterMountain();
      else UI.toast('The water vanishes beneath the shelf. The moss-covered steps begin ahead.');
      return;
    }
    if (this.scene === 'mountain') {
      if (p.x > 1322) this.enterTreasury();
      else if (p.x < 660) UI.toast('The broken steps are ahead. Build a little speed and jump.');
      else UI.toast('Cross the gap to reach the passage.');
      return;
    }
    if (this.scene === 'treasury') {

      if (available) {

          UI.setObjective('Leave the chamber and follow the stone ledge toward daylight.');

  completeRun() {
    if (this.complete) return;

    this.player.vx = 0; this.player.showJournal = true;

  update(dt) {
    this.sceneTime += dt;
    if (this.scene === 'bus') {
      this.cinematicTime += dt;
      if (this.cinematicTime > 9.5) this.startYard();
      return;
    }
    if (this.scene === 'yard') {
      this.cinematicTime += dt;
      if (this.cinematicTime > 13.5) this.startTrain();
      return;
    }
    if (this.scene === 'train') { this.updateTrain(dt); return; }
    if (!this.isPlaying()) return;
    if (this.scene === 'treasury') {
      this.treasuryCycle += dt;
      const period = 6.6, ph = this.treasuryCycle % period;
      this.shutterOpen = smoothstep(2.35, 3.05, ph) * (1 - smoothstep(5.03, 5.68, ph));
      if (this.treasuryCycle > 3.2 && !this.messageFlags.has('shutter-start')) {
        this.messageFlags.add('shutter-start');
        this.say('A weighted stone shutter lifts, holds, then falls. Wait safely in the alcove.', 'FIELD NOTE', 4.0, true);
      }
    }
    if (this.scene === 'forest' && this.chaseStarted && !this.inHollow) this.updateChase(dt);
    if (this.inHollow) { this.updateHide(dt); return; }
    this.updatePlayer(dt);
    if (this.scene === 'tree') this.updateTree(dt);
    if (this.scene === 'forest') this.updateForest(dt);
    if (this.scene === 'mountain') this.updateMountain(dt);
    if (this.scene === 'treasury') this.updateTreasury(dt);
    if (this.scene === 'escape') this.updateEscape(dt);
    const len = SCENE_LENGTH[this.scene] || 2200;
    const maxCam = Math.max(0, len - this.viewW);
    const targetCam = clamp(this.player.x - this.viewW * (this.scene === 'treasury' ? 0.36 : 0.39), 0, maxCam);
    this.cameraX = prefersReduced ? targetCam : lerp(this.cameraX, targetCam, 1 - Math.pow(0.001, dt));
    this.updatePrompt();
  },
  updateTrain(dt) {
    this.trainProgress += dt * 79;
    this.player.walkPhase += dt * 3.6;
    if (this.trainProgress > 300 && this.trainProgress < 485 && !this.stationCuePlayed) {
      this.stationCuePlayed = true;
      UI.setSubtitle('The small platform slips by. DEVRAI HALT. The goods train does not stop.', 'FIELD NOTE', 4.4, true);
      UI.setObjective('Watch the dark tree line beyond the station.');
    }
    if (this.trainProgress >= 675 && this.trainProgress < 1048) {
      if (!this.treeCuePlayed) {
        this.treeCuePlayed = true;
        UI.showBanner('THE SACRED TREE · JUMP WHEN IT ALIGNS', '', 0);
        UI.setObjective('Jump from the wagon when the glowing tree draws level.');
        this.say('There — the branching light from the journal. This is the place.', 'THOUGHT', 4.1, true);
        Sound.setMood('tree');
      }
    }
    if (this.trainJumping) {
      this.trainJumpT += dt;
      const p = this.player;
      p.y = Math.max(0, Math.sin(Math.min(1, this.trainJumpT / 0.82) * Math.PI) * 62);
      if (this.trainJumpT > 0.84) {
        this.trainJumping = false;
        Sound.sfx('land');
        this.enterTree(); return;
      }
    }
    if (this.trainProgress > 1060 && !this.trainJumping) this.missTrain();
    const maxCam = 0;
    this.cameraX = 0;
    this.updatePrompt();
  },
  updatePlayer(dt) {
    const p = this.player;
    const left = Input.held.has('left'), right = Input.held.has('right');
    const dir = (right ? 1 : 0) - (left ? 1 : 0);
    // Jump / hide are dispatched once from inputAction so a key press is never handled twice.
    const speed = this.scene === 'forest' && this.chaseStarted ? (Input.held.has('sprint') ? 355 : 306) : (Input.held.has('sprint') ? 255 : 195);
    const targetV = dir * speed;
    const accel = p.onGround ? 1100 : 540;
    p.vx = approach(p.vx, targetV, accel * dt);
    if (!dir) p.vx = approach(p.vx, 0, (p.onGround ? 1250 : 260) * dt);
    if (dir) p.face = dir;
    p.x += p.vx * dt;
    const len = SCENE_LENGTH[this.scene] || 2200;
    p.x = clamp(p.x, 14, len - 38);
    // Timed stone shutter: a visible, nonlethal barrier. Bumping returns to the safe alcove.
    if (this.scene === 'treasury' && p.x > 742 && p.x < 818 && this.shutterOpen < 0.9) {
      p.x = 735; p.vx = 0; this.shutterBumpAt = this.sceneTime;
      UI.toast('The shutter is closed. Wait in the safe alcove for the next opening.');
      Sound.sfx('stone');

    // Vertical motion, including the mountain gap.
    const inGap = this.scene === 'mountain' && p.x > this.gapStart && p.x < this.gapEnd;
    if (!p.onGround || p.vy > 0 || p.gapFalling) {
      p.vy -= 1120 * dt;
      p.y += p.vy * dt;
      if (p.y <= 0 && p.vy <= 0) {
        if (inGap) {
          p.y = 0; p.vy = -130; p.onGround = false; p.gapFalling = true;
        } else {
          p.y = 0; p.vy = 0; p.onGround = true; p.gapFalling = false;
          Sound.sfx('land');
        }
      }
      if (p.gapFalling && p.y < -115) {
        this.respawn('The broken stair is too wide at that point. Try the jump again from the nearby step.');
        return;
      }
    } else {
      if (inGap) { p.onGround = false; p.gapFalling = true; p.vy = -130; }
      else { p.y = 0; p.onGround = true; }
    }
    p.walkPhase += Math.abs(p.vx) * dt * 0.038;
    const moving = Math.abs(p.vx) > 38 && p.onGround;
    if (moving) {
      this.soundStepTimer -= dt;
      if (this.soundStepTimer <= 0) {
        Sound.sfx(this.scene === 'forest' || this.scene === 'tree' || this.scene === 'steps' ? 'stepMud' : 'step');

    if (this.scene === 'forest' && this.chaseStarted && dir > 0) {
      const obstacles = [ { x:1590, w:70, h:38, name:'fallen trunk' }, { x:1832, w:48, h:26, name:'low root' } ];
      for (const o of obstacles) {
        const prevX = p.x - p.vx * dt;
        const left = o.x - o.w * 0.5;
        // Block only while entering the obstacle footprint from the left, never after clearing it.
        if (prevX <= left + 0.5 && p.x > left && p.y < o.h) {
          p.x = left - 1; p.vx = 0;

          }

        }
      }

  },
  updateTree(dt) {
    if (this.player.x > 1435) this.enterForest();
  },
  updateForest(dt) {

        this.narrationFlags.add('satchel-say'); this.say('A strap hangs from a thorn. The trail is not empty.', 'THOUGHT', 3.7, true);
      }

      }

        }

  updateChase(dt) {

    else {
      const playerSp = Math.max(0, this.player.vx);
      const hunterSp = 208;
      this.hunterGap += (playerSp - hunterSp) * dt;
      this.hunterGap = clamp(this.hunterGap, 90, 620);
      if (this.hunterGap < 104) {
        this.respawn('The hunters caught the trail. You are back at the exposed crossing; your clues remain.');
        Sound.sfx('caught'); return;
      }
    }
    this.hunterStepTimer -= dt;
    if (this.hunterStepTimer <= 0 && !this.losBroken) {

  },
  updateHide(dt) {
    if (!this.inHollow) return;

        this.respawn('A leaf shifts underfoot. The lantern swings toward the hollow. You retreat to the last safe bend.');
        Sound.sfx('caught'); return;
      }
      this.hideTimer += dt;
      const remain = Math.max(0, 7.5 - this.hideTimer);
      UI.showBanner('HUNTERS SEARCHING · ' + remain.toFixed(1) + 's', '', 0);
      if (Math.floor(this.hideTimer) === 2 && !this.narrationFlags.has('search1')) {
        this.narrationFlags.add('search1'); this.say('“Check the waterline.” Boots stop just outside the roots.', 'THE HUNTERS', 3.0, false);
      }

        this.canLeaveHollow = true;
        UI.clearBanner();
        UI.setObjective('The footsteps have faded. Follow the screened water channel uphill.');
        UI.toast('The search moves on. A narrow water channel opens behind you.');
        this.say('The footsteps fade downriver. Behind the roots, water runs toward stone steps.', 'THOUGHT', 4.4, true);
        Sound.setMood('forest');
      }
    }

  },
  updateMountain(dt) {
    if (this.player.x > 560 && this.player.x < 700 && !this.messageFlags.has('stair-cp')) {
      this.messageFlags.add('stair-cp');
      this.setCheckpoint('mountain', 628, 'BROKEN STAIR');
    }

      this.messageFlags.add('gap-cue'); UI.toast('The stair breaks ahead. Jump across the visible gap.');
    }
  },
  updateTreasury(dt) {
    if (!this.messageFlags.has('shutter-rhythm')) {
      this.messageFlags.add('shutter-rhythm');
      this.say('A safe alcove overlooks the shutter. Watch it rise and fall before crossing.', 'FIELD NOTE', 4.0, true);
    }
    if (this.gateOpened && this.player.x > 2200) this.enterEscape();
  },
  updateEscape(dt) {
    if (this.player.x > 1850) this.completeRun();
  },
  updatePrompt() {
    if (!(this.isPlaying() || this.scene === 'train') || this.paused || this.overlayType !== null) { UI.clearPrompt(); return; }
    const p = this.player, x = p.x;
    let text = '';
    if (this.scene === 'tree') {
      if (Math.abs(x - 625) < 130 && !this.clueSet.has('tree')) text = '<span class="key">E</span><span>Inspect the mark carved in the roots</span>';
      else if (x > 1400) text = '<span class="key">→</span><span>Follow the stream into the forest</span>';
    } else if (this.scene === 'forest') {
      if (this.inHollow) {
        if (this.canLeaveHollow) text = '<span class="key">E</span><span>Follow the screened water channel uphill</span>';
      } else if (this.chaseStarted && Math.abs(x - this.hollowX) < 194) {

  paper(g, W, H, seed) {
    const r = rngFor('paper:' + seed);

      g.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 1.4);
    }
    // water stains
    for (let i = 0; i < 5; i++) {
      const cx = r() * W, cy = r() * H, rad = 30 + r() * 110;
      const st = g.createRadialGradient(cx, cy, rad * 0.2, cx, cy, rad);
      st.addColorStop(0, 'rgba(146,114,62,.05)'); st.addColorStop(0.75, 'rgba(146,114,62,.10)'); st.addColorStop(1, 'rgba(146,114,62,0)');
      g.fillStyle = st; g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fill();
    }
    // edge burn
    const edge = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
    edge.addColorStop(0, 'rgba(120,90,45,0)'); edge.addColorStop(1, 'rgba(103,74,34,.30)');
    g.fillStyle = edge; g.fillRect(0, 0, W, H);

    g.beginPath(); g.moveTo(W * 0.5, 0); g.lineTo(W * 0.5, H); g.stroke();
    return r;
  },
  hand(g, r, pts, col, wid, alpha) {
    g.strokeStyle = col || 'rgba(58,42,22,.82)'; g.lineWidth = wid || 1.6; g.globalAlpha = alpha === undefined ? 1 : alpha;
    g.lineCap = 'round'; g.lineJoin = 'round';

    for (let i = 1; i < pts.length; i++) {

  el: {},
  journalOpen: false, journalPage: 0, journalTab: 'pages', journalReturn: null,
  introPage: 0, overlay: null, cinematicBtn: null,

  init() {
    const $ = id => document.getElementById(id);
    this.el = {
      hud: $('hud'), chapter: $('chapterLabel'), objective: $('objective'), goldChip: $('goldChip'), goldValue: $('goldValue'),
      banner: $('banner'), prompt: $('prompt'), subtitle: $('subtitle'), touch: $('touch'), overlay: $('overlay'),
      btnJournal: $('btnJournal'), btnSound: $('btnSound'), btnPause: $('btnPause'), rotate: $('rotateHint')
    };

    this.el.btnSound.addEventListener('click', () => this.toggleSound());
    this.el.btnPause.addEventListener('click', () => this.togglePause());
    document.querySelectorAll('.tc').forEach(btn => {
      const act = btn.dataset.act;
      const down = e => { e.preventDefault(); btn.classList.add('active'); Input.setVirtual(act, true); if (act !== 'left' && act !== 'right') Input.press(act); };
      const up = e => { e.preventDefault(); btn.classList.remove('active'); Input.setVirtual(act, false); };
      btn.addEventListener('pointerdown', down);
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('pointerleave', up);
      btn.addEventListener('contextmenu', e => e.preventDefault());

    this.updateSoundIcon();

    const b = this.el.btnSound;
    b.classList.toggle('muted', Sound.muted);
    b.innerHTML = Sound.muted
      ? '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
  },
  toggleSound() {
    Sound.ensure();
    Sound.setMuted(!Sound.muted);
    this.updateSoundIcon();
    if (!Sound.muted) { Sound.setMood(Game.scene === 'menu' ? 'menu' : (SCENE_MOOD[Game.scene] || 'forest')); Sound.sfx('interact'); }
    this.toast(Sound.muted ? 'Sound muted' : 'Sound on');

  /* ---------- HUD ---------- */
  syncHud() {
    const playing = Game.isPlaying() || Game.scene === 'bus' || Game.scene === 'yard';
    this.el.hud.classList.toggle('hidden', !playing);
    this.el.chapter.textContent = CHAPTER_LABEL[Game.scene] || 'THE ANCESTOR’S JOURNAL';
    const obj = Game.objective || OBJECTIVE_DEFAULT[Game.scene] || '';

    this.el.goldChip.classList.toggle('hidden', !hasGold);

    this.el.touch.classList.toggle('hidden', !v || !this.isTouch());

    t.textContent = msg; t.style.display = 'block';
    t.style.animation = 'none'; void t.offsetWidth; t.style.animation = 'toastIn .3s ease-out';

          '<button class="btn ghost" id="btnHowto">Controls &amp; how to play</button>' +
        '</div>' +
        '<div class="menu-sound"><span id="soundState">Sound on</span><input id="vol" type="range" min="0" max="100" value="72" aria-label="Volume"><button class="btn ghost" id="btnMute" style="min-height:34px;padding:6px 12px;font-size:10px;letter-spacing:.16em;">Mute</button></div>' +
        '<div class="menu-foot">Sound is generated live · headphones recommended</div>' +
      '</div>');
    const start = document.getElementById('btnStart');
    start.focus();
    start.addEventListener('click', () => this.startIntro());
    document.getElementById('btnHowto').addEventListener('click', () => this.showHowTo());
    document.getElementById('btnMute').addEventListener('click', () => this.toggleSound());
    document.getElementById('soundState').textContent = Sound.muted ? 'Sound off' : 'Sound on';
    const vol = document.getElementById('vol');
    vol.value = Math.round(Sound.volume * 100);
    vol.addEventListener('input', e => { Sound.ensure(); Sound.setVolume(e.target.value / 100); Sound.setMuted(false); this.updateSoundIcon(); });
  },
  showHowTo() {
    this.openOverlay('menu',
      '<div class="panel">' +
        '<div class="eyebrow">Controls</div>' +
        '<h2>How to play</h2>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0 4px;">' +
          '<div><div class="setting" style="border-top:none"><span>Move</span><span><b>A</b> / <b>D</b> or <b>←</b> <b>→</b></span></div>' +
          '<div class="setting"><span>Jump / vault</span><span><b>Space</b> or <b>W</b></span></div>' +
          '<div class="setting"><span>Interact</span><span><b>E</b></span></div>' +
          '<div class="setting"><span>Hide / crouch</span><span><b>H</b></span></div></div>' +
          '<div><div class="setting" style="border-top:none"><span>Run faster</span><span><b>Shift</b></span></div>' +
          '<div class="setting"><span>Journal</span><span><b>J</b></span></div>' +
          '<div class="setting"><span>Pause</span><span><b>Esc</b> / <b>P</b></span></div>' +
          '<div class="setting"><span>Mute</span><span><b>M</b></span></div></div>' +
        '</div>' +
        '<p style="margin-top:12px;font-size:13px;color:#93a49a;">On touch screens use the on-screen arrows, <b>JUMP</b>, <b>USE</b> and <b>HIDE</b> buttons. Landscape gives the widest view.</p>' +
        '<p style="font-size:13px;color:#93a49a;">Gold only counts once you carry it out of the mountain. Checkpoints restore your progress — your journal notes stay with you.</p>' +
        '<div class="row" style="margin-top:16px;"><button class="btn primary" id="btnBack">Back</button></div>' +
      '</div>');
    document.getElementById('btnBack').addEventListener('click', () => this.showMenu());
  },
  startIntro() {
    Sound.ensure();
    Sound.setMood('city');
    Game.beginRun();
  },
  /* ---------- prologue panels ---------- */
  introPanels: [
    { img: 'cover', who: 'THE PARCEL', text: 'The parcel was soaked through when it arrived — kraft paper, twine, and a smell of wet stone. Inside, wrapped in oilcloth, was a journal that had clearly been read in the rain.' },
    { img: 'route', who: 'THE ROUTE', text: 'A hand-drawn line runs from the city, past a night bus, along a goods line, to a station drawn in tiny capitals: DEVRAI HALT. Beneath it, one instruction. “The goods train will pass it without stopping. That is where you must leave the train.”' },
    { img: 'tree', who: 'THE TREE', text: '“Beyond the station stands a sacred tree that holds its own light.” The drawing is careful, as if copied from life. A branching mark is pressed into the roots — the same mark appears on three other pages.' },
    { img: 'chamber', who: 'THE MOUNTAIN', text: 'The last page is a plan view of a small chamber: pillars, a stone shutter that rises and falls, and gold drawn in soft yellow washes. In the margin, in a different, shakier hand: “Take nothing you cannot carry out.”' }
  ],
  showIntroPage(i) {
    this.introPage = clamp(i, 0, this.introPanels.length - 1);
    const p = this.introPanels[this.introPage];
    const url = Ink[p.img]();
    const last = this.introPage === this.introPanels.length - 1;
    Game.paused = true; Game.overlayType = 'intro';
    this.openOverlay('intro',
      '<div class="journal" style="max-width:980px;">' +
        '<div class="journal-bar"><div class="journal-title">Prologue · the parcel</div>' +
          '<div class="journal-tabs">' + this.introPanels.map((_, k) => '<span class="jtab' + (k === this.introPage ? ' active' : '') + '">' + (k + 1) + '</span>').join('') + '</div>' +
          '<button class="journal-close" id="introSkip" title="Skip introduction">✕</button></div>' +
        '<div class="journal-body"><div class="page-spread" style="grid-template-columns:1.05fr 1fr;">' +
          '<div class="page left"><img class="journal-ill" id="introIll" src="' + url + '" alt="Illustrated journal page" /><div class="ill-cap">Tap the illustration to inspect it</div></div>' +
          '<div class="page"><div class="eyebrow" style="color:#8a6b3a;">' + p.who + '</div><p style="font-size:17px;">' + p.text + '</p>' +
            (this.introPage === 2 ? '<p class="quote">“Beyond the station stands a sacred tree that holds its own light.”</p>' : '') +
            (this.introPage === 3 ? '<p class="quote">“Follow the water. Where it disappears beneath the mountain, look for the steps.”</p>' : '') +
            '<div class="pg-num">' + (this.introPage + 1) + ' / ' + this.introPanels.length + '</div>' +
          '</div>' +
        '</div></div>' +
        '<div class="journal-nav"><button class="btn ghost" id="introPrev"' + (this.introPage === 0 ? ' disabled style="opacity:.35"' : '') + '>◀ Back</button>' +
          '<div class="row"><button class="btn ghost" id="introSkip2">Skip introduction</button>' +
          '<button class="btn primary" id="introNext">' + (last ? 'Leave the city' : 'Turn the page ▶') + '</button></div></div>' +
      '</div>');
    const ill = document.getElementById('introIll');
    ill.addEventListener('click', () => this.zoomImage(url, 'The journal, page ' + (this.introPage + 1)));
    document.getElementById('introNext').addEventListener('click', () => {
      Sound.sfx('page');
      if (last) Game.startBus(); else this.showIntroPage(this.introPage + 1);
    });
    document.getElementById('introPrev').addEventListener('click', () => { Sound.sfx('page'); this.showIntroPage(this.introPage - 1); });
    document.getElementById('introSkip').addEventListener('click', () => Game.startBus());
    document.getElementById('introSkip2').addEventListener('click', () => Game.startBus());
  },
  introKey(action) {
    if (action === 'right' || action === 'next' || action === 'interact' || action === 'jump' || action === 'confirm') {
      Sound.sfx('page');
      if (this.introPage >= this.introPanels.length - 1) Game.startBus(); else this.showIntroPage(this.introPage + 1);
    } else if (action === 'left' || action === 'prev') { Sound.sfx('page'); this.showIntroPage(this.introPage - 1); }
    else if (action === 'pause') Game.startBus();
  },
  zoomImage(url, caption) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(4,8,7,.94);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;cursor:zoom-out;animation:fadeIn .2s ease-out;';
    const img = document.createElement('img');
    img.src = url; img.alt = caption || 'Illustration';
    img.style.cssText = 'max-width:96vw;max-height:82vh;border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.8);border:1px solid rgba(226,177,105,.3);';
    const cap = document.createElement('div');
    cap.textContent = caption || ''; cap.style.cssText = 'font-family:var(--serif);font-style:italic;color:#cbbb96;font-size:14px;';
    wrap.appendChild(img); wrap.appendChild(cap);
    wrap.addEventListener('click', () => wrap.remove());
    document.getElementById('stage').appendChild(wrap);
  },
  /* ---------- journal ---------- */
  journalPages() {
    return [
      { left: 'cover', cap: 'The parcel, unwrapped', right: 'page1' },
      { left: 'route', cap: 'The hand-drawn route', right: 'page2' },
      { left: 'tree', cap: 'The tree that holds its own light', right: 'page3' },
      { left: 'chamber', cap: 'Plan of the chamber', right: 'page4' },
      { left: 'glyph', cap: 'The branching mark', right: 'page5' },
      { left: 'camp', cap: 'What earlier travellers left behind', right: 'page6' }
    ];
  },
  journalRight(page) {
    const body = {
      page1: '<h3>The parcel</h3><p>The journal came from a branch of the family no one speaks about. The pages are swollen with damp; the ink has bloomed in places, but the route is still legible.</p><p class="quote">“The goods train will pass it without stopping. That is where you must leave the train.”</p><p class="scrawl">— in the margin, in a hand that trembles at the end.</p>',
      page2: '<h3>Notes on the route</h3><p>A night bus leaves the city and does not stop until the hills. Beyond the last freight yard, a goods line runs into the forest. No passengers are carried; the yard says so plainly on a red sign.</p><ul><li>Bus first, then the wagon.</li><li>Watch the tree line on the right.</li><li>Jump when the glowing tree draws level.</li></ul>',
      page3: '<h3>Beyond the station</h3><p class="quote">“Beyond the station stands a sacred tree that holds its own light. The goods train will pass it without stopping. That is where you must leave the train.”</p><p>Under the drawing: <span class="scrawl">a branching mark is cut into the roots. The same mark is on the steps and on the gate.</span></p>',
      page4: '<h3>The chamber</h3><p>A small room inside the mountain. Four pillars, one shutter, three caches.</p><p class="quote">“The shutter is older than the gold. It will not be hurried. Watch one full turn from the alcove before you cross.”</p><p class="scrawl">Gold is not yours in the mountain. It is yours on the road home.</p>',
      page5: '<h3>The mark</h3><p>Three strokes rising from one stem, splitting again at the top. The ancestor drew it four times: at the roots, on the shelf, above the shutter, and beside the water gate.</p><p>It is not a letter. It reads more like a warning to whoever comes second.</p>',
      page6: '<h3>Earlier travellers</h3><p>A satchel cut clean through. A lantern left warm. Boots converging above the stream crossing.</p><p class="quote">“The forest is not empty and the camp is not friendly. Break their sight before you hide, and hide before you breathe.”</p>'
    }[page];
    return '<div class="page">' + body + '<div class="pg-num">journal</div></div>';
  },
  openJournal() {
    if (this.journalOpen) return;
    this.journalOpen = true;
    this.journalReturn = Game.overlayType;
    Game.paused = true; Game.overlayType = 'journal';
    this.journalTab = 'pages';
    this.renderJournal();
    Sound.sfx('page');
  },
  closeJournal() {
    this.journalOpen = false; Game.overlayType = null; Game.paused = false;
    this.el.overlay.classList.add('hidden'); this.el.overlay.innerHTML = '';
    this.overlay = null;
    const returnTo = this.journalReturn;
    this.journalReturn = null;
    if (returnTo === 'pause') { Game.overlayType = 'pause'; this.showPause(); }
    else if (returnTo === 'complete') { Game.paused = true; Game.overlayType = 'complete'; this.showCompletion(Game.gold); }
    Sound.sfx('page');
  },
  toggleJournal() {
    if (this.journalOpen) { this.closeJournal(); return; }
    const canOpen = ((Game.isPlaying() || Game.scene === 'bus' || Game.scene === 'yard') &&
      (Game.overlayType === null || Game.overlayType === 'pause')) || Game.overlayType === 'complete';
    if (!canOpen) return;
    this.openJournal();
  },
  renderJournal() {
    const pages = this.journalPages();
    this.journalPage = clamp(this.journalPage, 0, pages.length - 1);
    const pg = pages[this.journalPage];
    const imgUrl = Ink[pg.left]();
    let body;
    if (this.journalTab === 'pages') {
      body = '<div class="page-spread">' +
        '<div class="page left"><img class="journal-ill" id="jIll" src="' + imgUrl + '" alt="' + pg.cap + '" /><div class="ill-cap">' + pg.cap + ' · tap to inspect</div></div>' +
        this.journalRight(pg.right) + '</div>';
    } else {
      body = '<div style="padding:20px 24px;">' + this.clueHtml() + '</div>';
    }
    this.openOverlay('journal',
      '<div class="journal">' +
        '<div class="journal-bar"><div class="journal-title">The ancestor’s journal</div>' +
          '<div class="journal-tabs"><span class="jtab' + (this.journalTab === 'pages' ? ' active' : '') + '" data-tab="pages">Pages</span><span class="jtab' + (this.journalTab === 'clues' ? ' active' : '') + '" data-tab="clues">Clues (' + Game.clueSet.size + ')</span></div>' +
          '<button class="journal-close" id="jClose" title="Close (J)">✕</button></div>' +
        '<div class="journal-body">' + body + '</div>' +
        (this.journalTab === 'pages'
          ? '<div class="journal-nav"><button class="btn ghost" id="jPrev"' + (this.journalPage === 0 ? ' disabled style="opacity:.35"' : '') + '>◀</button>' +
            '<span style="font-size:10px;letter-spacing:.24em;color:#a8987a;text-transform:uppercase;">Page ' + (this.journalPage + 1) + ' of ' + pages.length + '</span>' +
            '<button class="btn ghost" id="jNext"' + (this.journalPage === pages.length - 1 ? ' disabled style="opacity:.35"' : '') + '>▶</button></div>'
          : '<div class="journal-nav"><span style="font-size:10px;letter-spacing:.2em;color:#a8987a;text-transform:uppercase;">Notes you have gathered</span><button class="btn primary" id="jClose2">Return to the trail</button></div>') +
      '</div>');
    document.getElementById('jClose').addEventListener('click', () => this.closeJournal());
    const jIll = document.getElementById('jIll');
    if (jIll) jIll.addEventListener('click', () => this.zoomImage(imgUrl, pg.cap));
    const prev = document.getElementById('jPrev'), next = document.getElementById('jNext');
    if (prev) prev.addEventListener('click', () => { Sound.sfx('page'); this.journalPage--; this.renderJournal(); });
    if (next) next.addEventListener('click', () => { Sound.sfx('page'); this.journalPage++; this.renderJournal(); });
    const c2 = document.getElementById('jClose2'); if (c2) c2.addEventListener('click', () => this.closeJournal());
    document.querySelectorAll('[data-tab]').forEach(t => t.addEventListener('click', () => { Sound.sfx('page'); this.journalTab = t.dataset.tab; this.renderJournal(); }));
  },
  clueHtml() {
    if (Game.clueSet.size === 0) return '<p class="empty">No clues noted yet. Inspect the marks you find along the route.</p>';
    return CLUES.filter(c => Game.clueSet.has(c.id)).map(c => '<div class="clue"><b>' + c.title + '</b><span>' + c.text + '</span></div>').join('');
  },
  syncJournalClues() { if (this.journalOpen && this.journalTab === 'clues') this.renderJournal(); },
  journalKey(action) {
    if (action === 'journal' || action === 'pause') this.closeJournal();
    else if (action === 'right' || action === 'next') { if (this.journalTab === 'pages' && this.journalPage < this.journalPages().length - 1) { this.journalPage++; this.renderJournal(); Sound.sfx('page'); } }
    else if (action === 'left' || action === 'prev') { if (this.journalTab === 'pages' && this.journalPage > 0) { this.journalPage--; this.renderJournal(); Sound.sfx('page'); } }
  },
  /* ---------- pause ---------- */
  togglePause() {
    if (this.journalOpen) { this.closeJournal(); return; }
    if (this.overlay === 'pause') this.resume(); else this.showPause();
  },
  showPause() {
    if (!Game.isPlaying() && Game.scene !== 'bus' && Game.scene !== 'yard') return;
    Game.paused = true; Game.overlayType = 'pause';
    const cp = Game.checkpoint;
    this.openOverlay('pause',
      '<div class="panel">' +
        '<div class="eyebrow">Paused</div>' +
        '<h2>The journal waits.</h2>' +
        '<p style="margin-bottom:6px;">' + (CHAPTER_LABEL[Game.scene] || '') + '</p>' +
        '<p style="font-size:13px;color:#8fa298;">Checkpoint: ' + (cp ? cp.label : 'none yet') + ' · Gold carried: ' + fmtGold(Game.gold) + '</p>' +
        '<div class="pause-actions">' +
          '<button class="btn primary" id="pResume">Resume</button>' +
          '<button class="btn" id="pJournal">Open the journal</button>' +
          '<button class="btn" id="pRestart">Restart from checkpoint</button>' +
          '<button class="btn" id="pMenu">Return to the title</button>' +
        '</div>' +
        '<div class="setting" style="margin-top:16px;"><span>Volume</span><input id="pVol" type="range" min="0" max="100" value="' + Math.round(Sound.volume * 100) + '" aria-label="Volume"></div>' +
        '<div class="setting"><span>Sound</span><button class="btn ghost" id="pMute" style="min-height:34px;padding:6px 14px;font-size:10px;">' + (Sound.muted ? 'Unmute' : 'Mute') + '</button></div>' +
      '</div>');
    document.getElementById('pResume').focus();
    document.getElementById('pResume').addEventListener('click', () => this.resume());
    document.getElementById('pJournal').addEventListener('click', () => { this.el.overlay.classList.add('hidden'); this.el.overlay.innerHTML = ''; this.openJournal(); });
    document.getElementById('pRestart').addEventListener('click', () => {
      this.hideOverlay(); Game.paused = false;
      if (Game.checkpoint) Game.respawn('Restarted from ' + Game.checkpoint.label + '.'); else Game.enterTree();
    });
    document.getElementById('pMenu').addEventListener('click', () => { this.hideOverlay(); Sound.setMood('menu'); Game.setScene('menu'); });
    const pv = document.getElementById('pVol');
    pv.addEventListener('input', e => { Sound.ensure(); Sound.setVolume(e.target.value / 100); Sound.setMuted(false); this.updateSoundIcon(); });
    document.getElementById('pMute').addEventListener('click', () => { this.toggleSound(); this.showPause(); });
  },
  resume() {
    if (this.overlay === 'pause') { this.hideOverlay(); }
    Game.paused = false; Game.overlayType = null;
  },
  /* ---------- completion ---------- */
  showCompletion(gold) {
    this.el.hud.classList.add('hidden');
    this.setTouchVisible(false);
    const crest = '<svg viewBox="0 0 100 100"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#a97c33"/></linearGradient></defs>' +
      '<path d="M50 12v58M50 40L30 22M50 46l22-20M30 22l-8-10M72 26l9-11" stroke="url(#cg)" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M50 70c-12 4-22 10-30 18M50 70c12 4 22 10 30 18M50 70v20" stroke="url(#cg)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>' +
      '<circle cx="50" cy="50" r="46" stroke="rgba(226,177,105,.22)" fill="none" stroke-width="1"/></svg>';
    this.openOverlay('complete',
      '<div class="complete">' +
        '<div class="crest">' + crest + '</div>' +
        '<div class="eyebrow" style="text-align:center;">Chapter one closes</div>' +
        '<h1>EXPEDITION COMPLETE</h1>' +
        '<div class="goldline">' + fmtGold(gold) + ' carried out of the mountain</div>' +
        '<div class="sub">Recovered in ' + Game.caches.filter(c => Game.goldSet.has(c.id)).length + ' of ' + Game.caches.length + ' caches · ' + Game.clueSet.size + ' journal clues</div>' +
        '<p class="closing">“The forest keeps its secrets. This gold is yours to carry home.”</p>' +
        '<div class="row" style="justify-content:center;">' +
          '<button class="btn primary" id="cReplay">Walk the route again</button>' +
          '<button class="btn ghost" id="cJournal">Read the journal</button>' +
        '</div>' +
        '<div class="hintline">The tree still holds its light. The ancestor’s name is not written anywhere.</div>' +
      '</div>');
    document.getElementById('cReplay').focus();
    document.getElementById('cReplay').addEventListener('click', () => { this.hideOverlay(); Game.beginRun(); });
    document.getElementById('cJournal').addEventListener('click', () => { this.el.overlay.classList.add('hidden'); this.el.overlay.innerHTML = ''; this.openJournal(); });
  }
};
/* ---------------------------------------------------------------- 7. INPUT */
const Input = {
  held: new Set(), pressed: new Set(), keyState: new Set(), virtual: new Set(), queue: [],
  keyMap: {
    ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
    Space:'jump', ArrowUp:'jump', KeyW:'jump',
    KeyE:'interact', Enter:'interact',
    KeyH:'hide', KeyJ:'journal', Escape:'pause', KeyP:'pause', KeyM:'mute',
    ShiftLeft:'sprint', ShiftRight:'sprint'
  },
  init() {
    window.addEventListener('keydown', e => {
      const a = this.keyMap[e.code];
      if (!a) return;
      if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
      if (!this.keyState.has(e.code)) {
        this.keyState.add(e.code);
        this.queue.push(a);
      }
    }, { passive:false });
    window.addEventListener('keyup', e => {
      const a = this.keyMap[e.code];
      if (!a) return;
      this.keyState.delete(e.code);
    });
    window.addEventListener('blur', () => { this.keyState.clear(); this.virtual.clear(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && Game.isPlaying()) UI.showPause();
    });
  },
  setVirtual(act, on) {
    if (on) this.virtual.add(act); else this.virtual.delete(act);
  },
  press(act) { this.queue.push(act); },
  tick(game, dt) {
    this.held.clear();
    this.keyState.forEach(code => { const a = this.keyMap[code]; if (a) this.held.add(a); });
    this.virtual.forEach(a => this.held.add(a));
    this.pressed.clear();
    const actions = this.queue.splice(0, this.queue.length);
    actions.forEach(a => {
      this.pressed.add(a);
      game.inputAction(a);
    });
    // Run is an on-key/virtual modifier and is never interpreted as an action.
    if (this.held.has('sprint')) this.held.add('sprint');
  },
  endFrame() { this.pressed.clear(); }
};

/* ---------------------------------------------------------------- 8. BOOT */
/* Visible title screen is drawn before a user gesture; audio begins only on action. */
window.addEventListener('DOMContentLoaded', () => {
  UI.init();
  Input.init();
  Game.scene = 'menu';
  Game.mode = 'menu';
  Game.paused = true;
  Game.overlayType = 'menu';
  Game.objective = '';
  Game._menuStarted = false;
  Game.resize();
  WorldCache.enter('forest', SCENE_LENGTH.menu);
  Renderer.draw(0);
  UI.showMenu();
  Game.init();
});
</script>
